# Publishes a release when a push changes mod_version in gradle.properties: to CurseForge, Modrinth
# and as a GitHub release (tag v<version>). Each platform that already has the version is left out,
# so a version published by hand is not uploaded twice, and "Run workflow" (manual) completes the
# current version where it is still missing. Needs the repository secrets CURSEFORGE_TOKEN and
# MODRINTH_TOKEN; without one, that platform is skipped with a warning.
name: publish
on:
  push:
    branches: ['26.3', '26.3-lockout-bot']
    paths: ['gradle.properties']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: what is missing?
        id: check
        env:
          HAVE_CURSEFORGE: ${{ secrets.CURSEFORGE_TOKEN != '' }}
          HAVE_MODRINTH: ${{ secrets.MODRINTH_TOKEN != '' }}
        run: |
          set -o pipefail
          v=$(sed -n 's/^mod_version=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          before="${{ github.event.before }}"
          old="$v"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then
            old=$(git show "$before:gradle.properties" | sed -n 's/^mod_version=[[:space:]]*//p' | tr -d '[:space:]')
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$old" = "$v" ]; then
            echo "mod_version unchanged ($v) - nothing to do."
            exit 0
          fi
          tasks=""
          # The file names on the project page (CurseForge's own list, else the cfwidget mirror of it).
          cf=$(curl -sfL -m 60 -A "Mozilla/5.0" "https://www.curseforge.com/api/v1/mods/1508454/files?pageIndex=0&pageSize=50&sort=dateCreated&sortDescending=true" | jq -ce '[.data[].fileName]') \
            || cf=$(curl -sfL -m 60 "https://api.cfwidget.com/minecraft/mc-mods/challenge" | jq -ce '[.files[].name]') \
            || { echo "::error::Could not read the CurseForge file list."; exit 1; }
          if echo "$cf" | jq -e --arg f "challengecraft-$v.jar" 'index($f) != null' > /dev/null; then
            echo "CurseForge already has $v."
          elif [ "$HAVE_CURSEFORGE" = "true" ]; then
            tasks="$tasks publishCurseforge"
          else
            echo "::warning::$v is not on CurseForge: add the repository secret CURSEFORGE_TOKEN (Settings > Secrets and variables > Actions)."
          fi
          mr=$(curl -sfL -m 60 "https://api.modrinth.com/v2/project/3qs3GQyx/version" | jq -ce '[.[].version_number]') \
            || { echo "::error::Could not read the Modrinth versions."; exit 1; }
          if echo "$mr" | jq -e --arg v "$v" 'index($v) != null' > /dev/null; then
            echo "Modrinth already has $v."
          elif [ "$HAVE_MODRINTH" = "true" ]; then
            tasks="$tasks publishModrinth"
          else
            echo "::warning::$v is not on Modrinth: add the repository secret MODRINTH_TOKEN (Settings > Secrets and variables > Actions)."
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null 2>&1; then
            echo "The GitHub release v$v exists."
          else
            tasks="$tasks publishGithub"
          fi
          echo "Publishing $v:${tasks:- nothing}"
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - name: setup jdk
        if: steps.check.outputs.tasks != ''
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: build and publish
        if: steps.check.outputs.tasks != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew build ${{ steps.check.outputs.tasks }}
