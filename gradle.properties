# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ is not yet fully compatible with the configuration cache (Loom issue #1349).
org.gradle.configuration-cache=false

# Minecraft 26.2 requires Java 25, and Loom demands that GRADLE ITSELF runs on it -- a Java
# toolchain is NOT sufficient (verified: "Minecraft 26.2 requires Java 25 but Gradle is using 21").
# Setting it here keeps the change PROJECT-LOCAL: JAVA_HOME stays on 21 and every other project
# on this machine is unaffected.
# org.gradle.java.home is intentionally NOT set here — it is an absolute path that
# only exists on one machine. Put it in ~/.gradle/gradle.properties instead, or set
# the Gradle JVM in your IDE. Committing it breaks every other clone and CI.

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
yarn_mappings=1.21.5+build.1
loader_version=0.19.3
loom_version=1.17.19

# Mod Properties
mod_version=1.0.7
maven_group=net.kasax.challengecraft
archives_base_name=challengecraft

# Dependencies
fabric_version=0.156.0+26.2
