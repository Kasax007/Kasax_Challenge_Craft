plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu, compile-only: the config-screen entrypoint is picked up when Mod Menu is installed
	// and simply never loaded when it is not. 21.x is the 26.3 line (20.x = 26.2).
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// Headless scenario tests for the bot (src/gametest): ./gradlew runGameTest
	configureTests {
		createSourceSet = true
		modId = "challengecraft-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// NO mappings line: Minecraft 26.x ships UNOBFUSCATED, so there is nothing to map. Declaring
	// officialMojangMappings() here fails with "Failed to find official mojang mappings for 26.2".
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// A version port routinely produces more than javac's default cap of 100 errors, and a
	// truncated list hides which files still need work.
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()

	// Minecraft 26.2 requires Java 25 (Mojang's version manifest: javaVersion.majorVersion = 25).
	// A Gradle TOOLCHAIN is NOT enough here — Loom refuses with "Minecraft 26.2 requires Java 25
	// but Gradle is using 21", so the JVM is pinned project-locally via org.gradle.java.home in
	// gradle.properties. JAVA_HOME stays on 21 for every other project.
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	}
}

// The bot scenarios take minutes: run them on purpose (./gradlew runGameTest), not with every build.
tasks.matching { it.name == 'runGameTest' }.configureEach {
	onlyIf { gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') } }
}
// Only some scenarios: ./gradlew runGameTest -PbotTest=pool
loom.runs.matching { it.name == 'gameTest' }.configureEach {
	if (project.hasProperty('botTest')) vmArg "-Dfabric-api.gametest.filter=${project.property('botTest')}"
	// Every plan the planner makes, step by step, in the log: ./gradlew runGameTest -PbotDebugPlan
	if (project.hasProperty('botDebugPlan')) vmArg "-Dbob.debugPlan=true"
}

// Footage for the shorts, frame by frame (src/film): ./gradlew runFilm -Pfilm=SCENE
// A client game test of its own source set, so the bot tests' test instances (far_walk's padding
// of 200 is more than the network can carry to a client) stay out of the client it films with.
sourceSets {
	film {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	mods {
		"challengecraft-film" {
			sourceSet sourceSets.film
		}
	}
	runs {
		film {
			client()
			name "Film"
			source sourceSets.film
			runDir "build/run/film"
			property "fabric.client.gametest"
			property "fabric.client.gametest.testModResourcesPath", file("src/film/resources").absolutePath
			vmArg "-Xmx3G"
			if (project.hasProperty('film')) vmArg "-Dfilm.scene=${project.property('film')}"
			if (project.hasProperty('filmOut')) vmArg "-Dfilm.out=${project.property('filmOut')}"
			if (project.hasProperty('filmSeed')) vmArg "-Dfilm.seed=${project.property('filmSeed')}"
		}
	}
}
tasks.matching { it.name == 'runFilm' }.configureEach {
	onlyIf { project.hasProperty('film') }
}
