plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu, compile-only: the config-screen entrypoint is picked up when Mod Menu is installed
	// and simply never loaded when it is not. 21.x is the 26.3 line (20.x = 26.2).
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// Headless scenario tests for the bot (src/gametest): ./gradlew runGameTest
	configureTests {
		createSourceSet = true
		modId = "challengecraft-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// NO mappings line: Minecraft 26.x ships UNOBFUSCATED, so there is nothing to map. Declaring
	// officialMojangMappings() here fails with "Failed to find official mojang mappings for 26.2".
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// A version port routinely produces more than javac's default cap of 100 errors, and a
	// truncated list hides which files still need work.
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()

	// Minecraft 26.2 requires Java 25 (Mojang's version manifest: javaVersion.majorVersion = 25).
	// A Gradle TOOLCHAIN is NOT enough here — Loom refuses with "Minecraft 26.2 requires Java 25
	// but Gradle is using 21", so the JVM is pinned project-locally via org.gradle.java.home in
	// gradle.properties. JAVA_HOME stays on 21 for every other project.
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The commit a jar was built from (with "+" when the tree had changes): the Bob-Autopilot writes
// it beside every result, so a game played on a rented server can be traced to its code.
def bobCommit = {
	try {
		def head = ['git', 'rev-parse', '--short=10', 'HEAD'].execute(null, projectDir)
		head.waitFor()
		if (head.exitValue() != 0) return 'unknown'
		def dirty = ['git', 'status', '--porcelain', '--untracked-files=no'].execute(null, projectDir)
		dirty.waitFor()
		return head.text.trim() + (dirty.text.trim() ? '+' : '')
	} catch (Exception ignored) {
		return 'unknown'
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
	manifest {
		attributes('Bob-Commit': bobCommit())
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	}
}

// Release: CurseForge, Modrinth and a GitHub release in one go (`./gradlew publishMods`). The
// workflow .github/workflows/publish.yml runs the tasks of the platforms still missing the version
// when a push changes mod_version. Without any token (on a PC) it is only a dry run; with one, that
// platform alone: CURSEFORGE_TOKEN=... ./gradlew publishCurseforge. The release notes:
// docs/curseforge/changelog-<version>.md.
def releaseNotes = project.file("docs/curseforge/changelog-${project.version}.md")
publishMods {
	file = jar.archiveFile
	changelog = releaseNotes.exists() ? releaseNotes.text : "Challenge Craft ${project.version}"
	type = STABLE
	displayName = "Challenge Craft ${project.version}"
	modLoaders.add("fabric")
	dryRun = ['CURSEFORGE_TOKEN', 'MODRINTH_TOKEN', 'GITHUB_TOKEN'].every { providers.environmentVariable(it).getOrNull() == null }

	curseforge {
		projectId = "1508454"
		projectSlug = "challenge"
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		minecraftVersions.add(project.minecraft_version)
		client = true
		server = true
		requires("fabric-api")
	}
	modrinth {
		projectId = "3qs3GQyx"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.add(project.minecraft_version)
		requires("fabric-api")
	}
	github {
		repository = "Kasax007/Kasax_Challenge_Craft"
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("26.3")
		tagName = "v${project.version}"
	}
}

// The bot scenarios take minutes: run them on purpose (./gradlew runGameTest), not with every build.
tasks.matching { it.name == 'runGameTest' }.configureEach {
	onlyIf { gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') } }
}
// Only some scenarios: ./gradlew runGameTest -PbotTest=pool
loom.runs.matching { it.name == 'gameTest' }.configureEach {
	if (project.hasProperty('botTest')) vmArg "-Dfabric-api.gametest.filter=${project.property('botTest')}"
	// Every plan the planner makes, step by step, in the log: ./gradlew runGameTest -PbotDebugPlan
	if (project.hasProperty('botDebugPlan')) vmArg "-Dbob.debugPlan=true"
	// The scenarios test the rules; the learnt models are gated by the arena (scripts/train).
	// With them: ./gradlew runGameTest -PbotLearned
	if (!project.hasProperty('botLearned')) vmArg "-Dbob.learned=0"
	// The knobs of every test bot, e.g. the old way of a round for a before/after run in one
	// build: ./gradlew runGameTest -PbotKnobs=halfair=0,airsafe=0 (a test that sets knobs of its own keeps those).
	if (project.hasProperty('botKnobs')) vmArg "-Dbob.knobs=${project.property('botKnobs')}"
}

// Footage for the shorts, frame by frame (src/film): ./gradlew runFilm -Pfilm=SCENE
// A client game test of its own source set, so the bot tests' test instances (far_walk's padding
// of 200 is more than the network can carry to a client) stay out of the client it films with.
sourceSets {
	film {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	mods {
		"challengecraft-film" {
			sourceSet sourceSets.film
		}
	}
	runs {
		film {
			client()
			name "Film"
			source sourceSets.film
			runDir "build/run/film"
			property "fabric.client.gametest"
			property "fabric.client.gametest.testModResourcesPath", file("src/film/resources").absolutePath
			vmArg "-Xmx3G"
			if (project.hasProperty('film')) vmArg "-Dfilm.scene=${project.property('film')}"
			if (project.hasProperty('filmOut')) vmArg "-Dfilm.out=${project.property('filmOut')}"
			if (project.hasProperty('filmSeed')) vmArg "-Dfilm.seed=${project.property('filmSeed')}"
		}
	}
}
tasks.matching { it.name == 'runFilm' }.configureEach {
	onlyIf { project.hasProperty('film') }
}

// The abstract Lockout simulator and Bob's look-ahead board brain (src/main/java/.../bot/lockout/sim):
// thousands of games a minute, no Minecraft run. ./gradlew bobSim --args="match --a greedy --b search --games 500"
// (modes and brains: see SimBench). Its checks: ./gradlew bobSimTest (about a minute).
tasks.register('bobSim', JavaExec) {
	dependsOn 'classes'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.kasax.challengecraft.bot.lockout.sim.SimBench'
	workingDir = projectDir
	maxHeapSize = '1G'
}
tasks.register('bobSimTest', JavaExec) {
	dependsOn 'classes'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.kasax.challengecraft.bot.lockout.sim.SimSelfTest'
	workingDir = projectDir
	maxHeapSize = '1G'
}

// The Bob-Autopilot (src/autopilot): Bob's self-play league on a rented server with a panel
// (docs/bob-bisect-server.md). A launcher of its own in plain Java - no Minecraft, no libraries -
// that the panel starts instead of Fabric's jar; it starts the Fabric servers with this mod itself.
// Built for Java 17 so that a panel still on an older Java gets a readable message, not a crash.
//   ./gradlew bobAutopilotJar    -> build/libs/bob-autopilot.jar
//   ./gradlew bobAutopilotTest   its tests
sourceSets {
	autopilot {
	}
	autopilotTest {
		compileClasspath += sourceSets.autopilot.output
		runtimeClasspath += sourceSets.autopilot.output
	}
}
dependencies {
	autopilotTestImplementation platform('org.junit:junit-bom:5.13.4')
	autopilotTestImplementation 'org.junit.jupiter:junit-jupiter'
	autopilotTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('compileAutopilotJava') {
	options.release = 17
}
tasks.named('compileAutopilotTestJava') {
	options.release = 17
}
tasks.register('bobAutopilotJar', Jar) {
	group = 'bob'
	description = 'The Bob-Autopilot launcher for a rented server (build/libs/bob-autopilot.jar).'
	from sourceSets.autopilot.output
	archiveFileName = 'bob-autopilot.jar'
	destinationDirectory = layout.buildDirectory.dir('libs')
	manifest {
		attributes('Main-Class': 'net.kasax.challengecraft.autopilot.Autopilot', 'Bob-Commit': bobCommit())
	}
}
tasks.register('bobAutopilotTest', Test) {
	group = 'bob'
	description = 'Tests of the Bob-Autopilot launcher.'
	testClassesDirs = sourceSets.autopilotTest.output.classesDirs
	classpath = sourceSets.autopilotTest.runtimeClasspath
	useJUnitPlatform()
	// (The knob table is compared with the laptop trainer's, scripts/train/bobleague.py.)
	systemProperty 'bob.repo', projectDir.absolutePath
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

// The trainer on the laptop (scripts/train/bobtrain.py) starts its dedicated servers itself - as
// many as the machine carries at the moment - the way runServer starts one, written down for it:
// the Java, the classpath, the JVM arguments and the main class (./gradlew bobLaunchSpec).
tasks.register('bobLaunchSpec') {
	dependsOn 'classes', 'configureLaunch'
	outputs.upToDateWhen { false }
	doLast {
		def run = tasks.getByName('runServer')
		def spec = [
			java      : run.javaLauncher.get().executablePath.asFile.absolutePath,
			classpath : run.internalClasspath.files.collect { it.absolutePath },
			jvmArgs   : run.internalJvmArgs.get(),
			mainClass : run.mainClass.get(),
			args      : run.args,
			projectDir: projectDir.absolutePath,
			version   : project.version.toString(),
		]
		def f = layout.buildDirectory.file("bob/launch-spec.json").get().asFile
		f.parentFile.mkdirs()
		f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(spec))
		println "Bob launch spec: ${f}"
	}
}
